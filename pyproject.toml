[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellsentinel"
version = "0.1.0"
description = "Early warning of undesirable events in offshore oil wells (Petrobras 3W dataset)"
authors = [{ name = "Ali Al Hooti" }]
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
