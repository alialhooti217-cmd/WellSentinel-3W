name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core dependencies
        run: pip install "numpy>=1.24" "pandas>=2.0" "pyarrow>=14.0" "scikit-learn>=1.3" "joblib>=1.3" "pyyaml>=6.0" "pytest>=7.0"
      - name: Run unit tests (synthetic data, no dataset download needed)
        run: pytest -q
